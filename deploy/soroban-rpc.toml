# One stellar-core process owned by stellar-rpc (11626 / 11628).
# Do not run stellar-core.service alongside this profile.
# Horizon uses STELLAR_CORE_URL=http://127.0.0.1:11626 (INGEST=false).

ENDPOINT = "0.0.0.0:8003"
NETWORK_PASSPHRASE = "Public Global Stellar Network ; September 2015"

# Required by stellar-rpc v26 validator even when captive owns the process.
STELLAR_CORE_URL = "http://127.0.0.1:11626"
STELLAR_CAPTIVE_CORE_HTTP_PORT = 11626
STELLAR_CAPTIVE_CORE_HTTP_QUERY_PORT = 11628
CAPTIVE_CORE_CONFIG_PATH = "/etc/stellar/stellar-captive-mainnet.cfg"
CAPTIVE_CORE_STORAGE_PATH = "/stellar/rpc-captive"
STELLAR_CORE_BINARY_PATH = "/usr/bin/stellar-core"

DB_PATH = "/stellar/stellar-rpc.sqlite"
HISTORY_ARCHIVE_URLS = [
  "https://bootes-history.publicnode.org",
  "https://lyra-history.publicnode.org",
  "http://history.stellar.org/prd/core-live/core_live_001",
]
HISTORY_RETENTION_WINDOW = 17280
LOG_LEVEL = "info"
MAX_HEALTHY_LEDGER_LATENCY = "168h"
BACKFILL = false
