# LumAgg self-host kit (Tranche 3 close-out).
# Requires: Docker, a reachable Soroban RPC, and built release binaries or images.
#
# Quick start:
#   cp scripts/arb.env.example deploy/arb.env   # optional arb
#   export SOROBAN_RPC_URL=https://soroban-rpc.mainnet.stellar.gateway.fm
#   docker compose -f docker-compose.selfhost.yml up -d redis
#   # Build locally: cargo build -p market-data-worker -p api-server -p analytics-indexer --release
#   # Then run worker + api on host pointing at this Redis (see README).

services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - lumagg-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional: run indexer beside API (mount same SQLite path on api-server via INDEXER_DB_PATH)
  indexer:
    image: debian:bookworm-slim
    profiles: ["analytics"]
    volumes:
      - ./target/release/analytics-indexer:/usr/local/bin/analytics-indexer:ro
      - ./data:/data
    environment:
      INDEXER_RPC_URL: ${SOROBAN_RPC_URL:-http://host.docker.internal:8003}
      AGGREGATOR_CONTRACT: ${AGGREGATOR_CONTRACT:-CC6QAV7JEG5MYRSPO5Z65E5G2M4ZB64BEG2ZXIZXL55TQT35JDI2LC6K}
      INDEXER_DB_PATH: /data/analytics-indexer.db
      INDEXER_MODE: events
      INDEXER_POLL_SECS: "30"
    command: ["analytics-indexer", "run"]
    restart: unless-stopped

volumes:
  lumagg-redis:
