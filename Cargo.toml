[workspace]
members = [
    "crates/market-snapshot",
    "crates/market-data-worker",
    "crates/router-engine",
    "crates/dex-adapters",
    "crates/api-server",
    "crates/lumagg-swap-api",
    "crates/arbitrage",
    "crates/analytics-indexer",
    "crates/lumagg-alerts",
    "crates/limit-keeper",
    "crates/sdk",
    "contracts/shared-types",
    "contracts/aggregator",
    "contracts/vault",
    "contracts/order-escrow"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Lum-Agg/stellar-dex-agg"

[workspace.dependencies]
# Stellar
stellar-xdr = "25.0.0"
stellar-strkey = { version = "0.0.16", features = ["serde-decoded"] }
stellar-baselib = "0.5.5"
soroban-client = "0.5.4"
stellar-rpc-client = "25.0.0"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Utilities
itertools = "0.14"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"

# pipeline
burberry = { git = "https://github.com/ligulfzhou/burberry", rev = "7cf9d163228b0e115946c789bcceff5723b334ef" }

[profile.release]
opt-level = 2
lto = "thin"
overflow-checks = true

# Soroban WASM release (workspace members cannot define [profile.*] locally).
[profile.contract-release]
inherits = "release"
opt-level = "z"
overflow-checks = true
debug = 0
strip = "debuginfo"
panic = "abort"
codegen-units = 1
lto = true
