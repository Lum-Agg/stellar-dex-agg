[workspace]
members = [
    "crates/router-engine",
    "crates/dex-adapters",
    "crates/api-server",
    "crates/sdk",
    "contracts/aggregator",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stellar-dex-aggregator/stellar-dex-aggregator"

[workspace.dependencies]
# Stellar
stellar-xdr = "25.0.0"
stellar-strkey = { version = "0.0.16", features = ["serde-decoded"] }
stellar-baselib = "0.5.5"
soroban-client = "0.5.4"
stellar-rpc-client = "25.0.0"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Utilities
itertools = "0.14"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"

[profile.release]
opt-level = 2
lto = "thin"
overflow-checks = true
