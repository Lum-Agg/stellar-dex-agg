openapi: 3.0.3
info:
  title: LumAgg API
  description: |
    Stellar DEX aggregator — quotes and unsigned swap transactions across Soroban AMMs
    (Soroswap, Aquarius, Phoenix, Sushi V3, Comet) and optionally Classic SDEX.

    **Rate limits:** 10 req/s per IP; 60 req/s with valid `X-API-Key` (partner keys).
    See [integrator-guide.md](./integrator-guide.md).
  version: 1.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.lumagg.xyz
    description: Production
  - url: http://127.0.0.1:3100
    description: Local dev
tags:
  - name: routing
  - name: tokens
  - name: prices
  - name: orders
  - name: wallet
  - name: tx
  - name: health
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Service health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/tokens:
    get:
      tags: [tokens]
      summary: Supported tokens
      responses:
        '200':
          description: Token list with logos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
  /api/v1/quote:
    get:
      tags: [routing]
      summary: Best swap route
      description: |
        Returns optimal route(s) and expected output. Set `prefer_soroban=1` to exclude
        Classic SDEX paths (apples-to-apples vs Soroban-only aggregators).
      parameters:
        - $ref: '#/components/parameters/token_in'
        - $ref: '#/components/parameters/token_out'
        - $ref: '#/components/parameters/amount_in'
        - name: slippage
          in: query
          required: false
          schema:
            type: number
            format: double
            example: 0.5
          description: Slippage tolerance in percent (default 0.5)
        - name: prefer_soroban
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: When `1`, exclude Classic SDEX — Soroban AMMs only
        - name: debug
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: Include split optimizer debug when `1`
      responses:
        '200':
          description: Quote result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid parameters
        '429':
          description: Rate limit exceeded
  /api/v1/build_tx:
    post:
      tags: [routing]
      summary: Build unsigned swap transaction
      description: |
        Builds wallet-ready XDR from quote `sub_routes`. Classic routes return PathPayment XDR;
        Soroban routes return invoke host function XDR (simulated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildTxRequest'
      responses:
        '200':
          description: Unsigned transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildTxResponse'
        '400':
          description: Invalid body or unsupported route mix
        '429':
          description: Rate limit exceeded
  /api/v1/stats:
    get:
      tags: [health]
      summary: On-chain aggregator stats (indexer DB)
      description: |
        Daily rollups from `analytics-indexer` SQLite. Requires `INDEXER_DB_PATH` on the API server.
        Optional `day=YYYY-MM-DD` filters to a single UTC day. Set `format=csv` for grant report download.
      parameters:
        - name: day
          in: query
          required: false
          schema:
            type: string
            example: "2026-07-13"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Stats rollup (JSON or CSV)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
            text/csv:
              schema:
                type: string
        '503':
          description: INDEXER_DB_PATH not configured
  /api/v1/swaps:
    get:
      tags: [health]
      summary: Wallet swap history (indexer DB)
      description: |
        Recent LumAgg aggregator invocations for a Stellar account. Requires `INDEXER_DB_PATH`
        on the API server (same SQLite as `/stats`). Ordered by `created_at` descending.
      parameters:
        - name: user
          in: query
          required: true
          schema:
            type: string
            example: "GABCDEFGHIJKLMNOPQRSTUVWXYZ234567ABCDEFGHIJKLMNOPQRSTUVW"
          description: Stellar account public key (`G…`, 56 chars)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Max rows to return (default 20)
      responses:
        '200':
          description: Swap history for the wallet (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapsResponse'
        '400':
          description: Missing or invalid `user`
        '503':
          description: INDEXER_DB_PATH not configured
  /api/v1/orders:
    get:
      tags: [orders]
      summary: Wallet limit orders (indexer DB)
      description: |
        Open and historical limit orders for a Stellar account from escrow lifecycle events.
        Requires `INDEXER_DB_PATH` on the API server (same SQLite as `/stats` and `/swaps`).
        Default `status=open` returns only open orders; `status=all` includes filled, cancelled, and expired.
      parameters:
        - name: user
          in: query
          required: true
          schema:
            type: string
            example: "GABCDEFGHIJKLMNOPQRSTUVWXYZ234567ABCDEFGHIJKLMNOPQRSTUVW"
          description: Stellar account public key (`G…`, 56 chars)
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, all]
            default: open
          description: Filter by order status (default `open`)
      responses:
        '200':
          description: Limit orders for the wallet (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '400':
          description: Missing or invalid `user` / `status`
        '503':
          description: INDEXER_DB_PATH not configured
  /api/v1/orders/build_create:
    post:
      tags: [orders]
      summary: Build unsigned create-limit transaction
      description: |
        Simulates and prepares wallet-ready XDR invoking `order-escrow.create_limit`.
        Requires `ESCROW_CONTRACT` on the API server. Wallet signs and submits via Soroban RPC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildCreateOrderRequest'
      responses:
        '200':
          description: Unsigned transaction (or `success: false` with build error in body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBuildTxResponse'
        '400':
          description: Invalid body
        '503':
          description: ESCROW_CONTRACT not configured
        '429':
          description: Rate limit exceeded
  /api/v1/orders/build_cancel:
    post:
      tags: [orders]
      summary: Build unsigned cancel-order transaction
      description: |
        Simulates and prepares wallet-ready XDR invoking `order-escrow.cancel`.
        Requires `ESCROW_CONTRACT` on the API server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildCancelOrderRequest'
      responses:
        '200':
          description: Unsigned transaction (or `success: false` with build error in body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBuildTxResponse'
        '400':
          description: Invalid body
        '503':
          description: ESCROW_CONTRACT not configured
        '429':
          description: Rate limit exceeded
  /api/v1/prices:
    get:
      tags: [prices]
      summary: Latest USDC marks (batch)
      description: |
        Returns the latest sampled or on-demand USDC price per token id. When no tick exists
        in the price store, the server quotes once via the routing engine and may persist a tick.
        Unpriceable ids are omitted from the response.
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
            example: "CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA,CCW67TSZV3SSS2HXMBQ5JFGCKJNXKZM7UQUWUZPUTHXSTZLEO7SJMI75"
          description: Comma-separated token contract ids (max 50)
      responses:
        '200':
          description: Latest prices (may be partial)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesResponse'
        '400':
          description: Missing or invalid `ids`
  /api/v1/prices/history:
    get:
      tags: [prices]
      summary: Sampled USDC price history
      description: |
        Returns quote-sampled USDC ticks for sparkline charts. Requires `PRICE_DB_PATH` on the
        server for non-empty history; otherwise returns `200` with `points: []`.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            example: "CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA"
          description: Token contract id
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
          description: History window (default `24h`)
      responses:
        '200':
          description: Price ticks in the requested range (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryResponse'
        '400':
          description: Missing or invalid `id` / `range`
  /api/v1/balance:
    get:
      tags: [wallet]
      summary: Single SAC balance + trustline hint
      description: |
        Simulates SAC `balance` for `account`/`token`. Native XLM SAC always reports
        `has_trustline: true`. Missing classic trustline yields `balance: "0"` and
        `has_trustline: false` when detectable.
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
            example: "GA6RKSBPI2TSP52OW2IJTPK7LRMX24DF42KF3FBGBNMBYCV6NPDMOCBY"
        - name: token
          in: query
          required: true
          schema:
            type: string
            example: "CAS3J7GYLGXMF6TDJBBYYSE3HQ6BBSMLNUQ34T6TZMYMW2EVH34XOWMA"
      responses:
        '200':
          description: BalanceResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
  /api/v1/balances:
    get:
      tags: [wallet]
      summary: Common-token balances for account
      description: Batch balances for curated common token ids (same set as portfolio).
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: BalancesResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'
  /api/v1/account:
    get:
      tags: [wallet]
      summary: Account sequence via Soroban RPC
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AccountResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
  /api/v1/classic_asset:
    get:
      tags: [wallet]
      summary: Resolve SAC contract to classic code/issuer
      parameters:
        - name: contract
          in: query
          required: true
          schema:
            type: string
            description: SAC contract id (`C…`)
      responses:
        '200':
          description: ClassicAssetResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicAssetResponse'
  /api/v1/ledger/latest:
    get:
      tags: [wallet]
      summary: Latest closed ledger sequence
      responses:
        '200':
          description: LatestLedgerResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestLedgerResponse'
  /api/v1/submit_tx:
    post:
      tags: [tx]
      summary: Submit signed XDR (fast enqueue)
      description: |
        Proxies signed envelope to the server Soroban RPC and returns quickly
        (`PENDING` / hash). Poll `GET /api/v1/tx_status` for inclusion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed_tx_xdr]
              properties:
                signed_tx_xdr:
                  type: string
                  description: Base64 signed transaction envelope XDR
      responses:
        '200':
          description: Enqueued or accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitTxResponse'
        '400':
          description: Missing signed_tx_xdr
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitTxResponse'
  /api/v1/tx_status:
    get:
      tags: [tx]
      summary: Poll inclusion after submit_tx
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: TxStatusResponse (`confirmed` true only when status is SUCCESS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxStatusResponse'
components:
  parameters:
    token_in:
      name: token_in
      in: query
      required: true
      schema:
        type: string
      description: Input token contract ID (or `native` for XLM)
    token_out:
      name: token_out
      in: query
      required: true
      schema:
        type: string
      description: Output token contract ID
    amount_in:
      name: amount_in
      in: query
      required: true
      schema:
        type: string
      description: Input amount in stroops (7 decimals for most SAC tokens)
  schemas:
    Token:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        name:
          type: string
        decimals:
          type: integer
        logo:
          type: string
    QuoteResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            amount_in:
              type: string
            expected_output:
              type: string
            minimum_output:
              type: string
            price_impact:
              type: number
            is_split:
              type: boolean
            sub_routes:
              type: array
              items:
                $ref: '#/components/schemas/SubRoute'
            compute_time_ms:
              type: integer
        error:
          type: string
    SubRoute:
      type: object
      properties:
        source:
          type: string
        path:
          type: array
          items:
            type: string
        pool_addresses:
          type: array
          items:
            type: string
        dex_types:
          type: array
          items:
            type: string
        in_indices:
          type: array
          items:
            type: integer
        out_indices:
          type: array
          items:
            type: integer
        amount_in:
          type: string
        amount_out:
          type: string
        percentage:
          type: number
    BuildTxRequest:
      type: object
      required:
        - user_public_key
        - token_in
        - token_out
        - amount_in
        - min_amount_out
        - sub_routes
      properties:
        user_public_key:
          type: string
          description: Stellar G-address (signer)
        token_in:
          type: string
        token_out:
          type: string
        amount_in:
          type: string
        min_amount_out:
          type: string
        sub_routes:
          type: array
          items:
            type: object
            properties:
              amount_in:
                type: string
              steps:
                type: array
                items:
                  type: object
                  properties:
                    dex_type:
                      type: string
                    pool_address:
                      type: string
                    token_in:
                      type: string
                    token_out:
                      type: string
                    in_idx:
                      type: integer
                    out_idx:
                      type: integer
    BuildTxResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            xdr:
              type: string
            execution:
              type: string
              enum: [soroban, classic]
            hash:
              type: string
        error:
          type: string
    StatsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            db_path:
              type: string
            invocation_count:
              type: integer
            cursor_ledger:
              type: integer
            oldest_created_at:
              type: integer
            daily:
              type: array
              items:
                type: object
                properties:
                  day:
                    type: string
                  tx_count:
                    type: integer
                  unique_users:
                    type: integer
                  total_amount_in:
                    type: string
                  split_swap_count:
                    type: integer
                  success_count:
                    type: integer
                  failed_count:
                    type: integer
        error:
          type: string
    SwapsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            swaps:
              type: array
              items:
                $ref: '#/components/schemas/SwapItem'
        error:
          type: string
    SwapItem:
      type: object
      properties:
        tx_hash:
          type: string
        ledger:
          type: integer
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        status:
          type: string
          example: SUCCESS
        function_name:
          type: string
          example: swap
        token_in:
          type: string
          nullable: true
        token_out:
          type: string
          nullable: true
        amount_in:
          type: string
        amount_out:
          type: string
          nullable: true
        is_split:
          type: boolean
    OrdersResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            orders:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
        error:
          type: string
    OrderItem:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
        owner:
          type: string
        token_in:
          type: string
        token_out:
          type: string
        amount_in_initial:
          type: string
          nullable: true
        amount_in_remaining:
          type: string
        limit_out_per_in_e7:
          type: string
          description: Minimum output per 1e7 units of input (escrow limit price)
        expires_ledger:
          type: integer
          format: int32
        status:
          type: string
          example: open
        created_ledger:
          type: integer
          format: int32
          nullable: true
        updated_ledger:
          type: integer
          format: int32
        created_at:
          type: integer
          nullable: true
          description: Unix timestamp (seconds)
        updated_at:
          type: integer
          description: Unix timestamp (seconds)
    BuildCreateOrderRequest:
      type: object
      required:
        - user
        - token_in
        - token_out
        - amount_in
        - limit_out_per_in_e7
        - expires_ledger
      properties:
        user:
          type: string
          description: Stellar G-address (order owner / signer)
        token_in:
          type: string
          description: Input token contract id (C…)
        token_out:
          type: string
          description: Output token contract id (C…)
        amount_in:
          type: string
          description: Input amount in stroops
        limit_out_per_in_e7:
          type: string
          description: Minimum output per 1e7 units of input
        expires_ledger:
          type: integer
          format: int32
          description: Ledger sequence after which the order may be reclaimed
    BuildCancelOrderRequest:
      type: object
      required:
        - user
        - order_id
      properties:
        user:
          type: string
          description: Stellar G-address (order owner / signer)
        order_id:
          type: integer
          format: int64
          description: Escrow order id to cancel
    OrderBuildTxResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            unsigned_tx_xdr:
              type: string
              description: Unsigned transaction envelope XDR (base64)
            fee:
              type: string
              description: Estimated fee in stroops
            execution:
              type: string
              enum: [soroban]
            num_operations:
              type: integer
            contract:
              type: string
              description: Deployed order-escrow contract id (C…)
        error:
          type: string
    PricesResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            prices:
              type: array
              items:
                $ref: '#/components/schemas/PriceItem'
        error:
          type: string
    PriceItem:
      type: object
      properties:
        id:
          type: string
          description: Token contract id
        price_usdc:
          type: number
          format: double
          description: USDC mark (1 unit of token)
        ts:
          type: integer
          description: Unix timestamp (seconds) when the mark was recorded
        via:
          type: string
          enum: [usdc, xlm]
          description: Route used for the mark (`usdc` direct or via XLM)
    PriceHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
            range:
              type: string
              enum: [24h, 7d]
            points:
              type: array
              items:
                $ref: '#/components/schemas/PricePoint'
        error:
          type: string
    PricePoint:
      type: object
      properties:
        ts:
          type: integer
          description: Unix timestamp (seconds)
        price_usdc:
          type: number
          format: double
    BalanceResponse:
      type: object
      properties:
        success:
          type: boolean
        balance:
          type: string
          description: Raw token units (stroops-style)
        has_trustline:
          type: boolean
          description: Classic trustline presence when known
        error:
          type: string
    BalancesResponse:
      type: object
      properties:
        success:
          type: boolean
        account:
          type: string
        scope:
          type: string
          example: common
        tokens_queried:
          type: array
          items:
            type: string
        balances:
          type: object
          additionalProperties:
            type: string
        has_trustline:
          type: object
          additionalProperties:
            type: boolean
        updated_at_ms:
          type: integer
          format: int64
        error:
          type: string
    AccountResponse:
      type: object
      properties:
        success:
          type: boolean
        sequence:
          type: string
        error:
          type: string
    ClassicAssetResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        issuer:
          type: string
        error:
          type: string
    LatestLedgerResponse:
      type: object
      properties:
        success:
          type: boolean
        sequence:
          type: integer
          format: int64
        error:
          type: string
    SubmitTxResponse:
      type: object
      properties:
        success:
          type: boolean
        hash:
          type: string
        status:
          type: string
          description: e.g. PENDING, DUPLICATE, ERROR
        error:
          type: string
    TxStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        hash:
          type: string
        status:
          type: string
          description: SUCCESS | FAILED | NOT_FOUND | …
        confirmed:
          type: boolean
          description: True only when status is SUCCESS
        error:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional partner key for higher rate limits
security:
  - ApiKeyAuth: []
